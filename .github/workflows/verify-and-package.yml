name: Verify Build & Package APK Web Assets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Web Structure (Root index.html & Assets)
        run: |
          echo "=== 1. Checking Root index.html ==="
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html missing at root!"
            exit 1
          fi
          echo "✓ index.html found at root."

          echo "=== 2. Checking CSS and JS Assets ==="
          if [ ! -f "css/style.css" ]; then
            echo "ERROR: css/style.css missing!"
            exit 1
          fi
          if [ ! -f "js/app.js" ]; then
            echo "ERROR: js/app.js missing!"
            exit 1
          fi
          echo "✓ css/style.css and js/app.js found."

          echo "=== 3. Checking Mirror Assets in www and Android Assets ==="
          if [ ! -f "www/index.html" ]; then
            echo "Warning: www/index.html missing, creating..."
            mkdir -p www
            cp index.html www/
            cp -r css js www/
          fi
          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "Warning: Android asset index.html missing, creating..."
            mkdir -p app/src/main/assets
            cp -r index.html css js www app/src/main/assets/
          fi
          echo "✓ All web mirrors verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Native Android APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Package Web Bundle (ZIP with index.html at ROOT)
        run: |
          mkdir -p dist
          # Package ONLY the web contents directly so index.html is at the ROOT of the zip
          zip -r dist/ava-apk-ready.zip index.html css/ js/
          echo "✓ Created dist/ava-apk-ready.zip with index.html directly in the root."
          unzip -l dist/ava-apk-ready.zip

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-native-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload External-Converter Web ZIP (index.html at root)
        uses: actions/upload-artifact@v4
        with:
          name: ava-external-apk-ready-web-zip
          path: dist/ava-apk-ready.zip
